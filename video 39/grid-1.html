<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS GRID</title>
    <style>
        .container{
            border: 5px solid black;
            display: grid;
            /* grid-template-columns: repeat(4,1fr); */
            /* grid-template-rows: 100px 100px 100px; align me content vertically up down hota hai aur justity me content aage piche horizontally hota hai */
           grid-template-columns: repeat(4,80px);

            gap: 30px;
            justify-content: center;
            align-items: center;
        }

        .item{
            border: 5px solid red;
            height: 55px;
            width: 55px;
            
        }

        .item-4{
            /* grid-column: 1/2;
            grid-row: 1/2; */
        }

         .item-1{
            /* grid-column: 1/2;
            grid-row: 1/2; */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item item-1">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item item-4">4</div>
        <div class="item">5</div>
    </div>
    
</body>
</html>
